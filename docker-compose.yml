services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-carepulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-carepulse}
      POSTGRES_DB: ${POSTGRES_DB:-carepulse}
    ports:
      - "5432:5432"
    volumes:
      - carepulse_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-carepulse} -d ${POSTGRES_DB:-carepulse}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://carepulse:carepulse@postgres:5432/carepulse}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-development}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      ADMIN_DEMO_PASSWORD: ${ADMIN_DEMO_PASSWORD:-CarePulseAdmin!23}
      CLINICIAN_DEMO_PASSWORD: ${CLINICIAN_DEMO_PASSWORD:-CarePulseClinician!23}
      MODEL_PATH: ${MODEL_PATH:-/app/models/rf_v1.joblib}
      FEATURE_VERSION: ${FEATURE_VERSION:-fv1}
    volumes:
      - ./models:/app/models:ro
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    depends_on:
      backend:
        condition: service_healthy

volumes:
  carepulse_pgdata:
